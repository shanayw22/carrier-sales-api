services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/carrier_metrics
      - API_KEY=dev-secret-key-12345
      - FMCSA_API_KEY=${FMCSA_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: carrier_metrics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d carrier_metrics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: